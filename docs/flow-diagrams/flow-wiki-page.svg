<text x="40" y="278" font-size="11" fill="#5F5E5A">모델 결정(279): 양방향 backlinks 채택 — "이 개념이 내 독서 전반에서 얼마나 닿았나" 자동 집계. 페이지 삭제 시 정합성 처리.</text>
<text x="40" y="298" font-size="11" fill="#5F5E5A">연관: WikiPage ← ingest(4-2) 생성/갱신, → Nudge(4-3) 입력. 책 가로지르는 연결은 상위개념 노드로(320).</text>
