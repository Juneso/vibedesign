<style>
  :root { --bg:#1b1c22; --panel:#23242c; --line:#3a3b45; --leaf:#2c2e38; --leaf-b:#4a4c5a;

          --txt:#e7e7ee; --dim:#9fa0ad; --accent:#6fd99a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);

  #wrap { display:flex; height:100vh; }
  #stage { flex:1; overflow:auto; position:relative; }
  header { position:absolute; top:0; left:0; right:0; padding:16px 22px; z-index:5;
    background:linear-gradient(180deg,rgba(27,28,34,.96),rgba(27,28,34,0)); pointer-events:none; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header p { margin:4px 0 0; font-size:12px; color:var(--dim); }
  svg { display:block; }
  .link { fill:none; stroke:var(--line); stroke-width:1.5; }
  .node { cursor:pointer; }
  .node rect { rx:9; transition:filter .15s, stroke .15s; }
  .node.leaf rect { fill:var(--leaf); stroke:var(--leaf-b); }
  .node.theme rect { fill:var(--theme); stroke:var(--theme-b); }
  .node.root rect { fill:var(--root); stroke:var(--root-b); }
  .node text { fill:var(--txt); font-size:13px; dominant-baseline:middle; }
  .node .cnt { fill:var(--dim); font-size:11px; }
  .node:hover rect { filter:brightness(1.25); }
  .node.sel rect { stroke:var(--accent); stroke-width:2.5; filter:brightness(1.2); }
  #panel { width:0; transition:width .22s ease; background:var(--panel); overflow:hidden;
    border-left:1px solid var(--line); display:flex; flex-direction:column; position:relative; }
  #panel.open { width:440px; }
  #panel .ph { padding:18px 20px 12px; border-bottom:1px solid var(--line); }
  #panel .ph .kind { font-size:11px; color:var(--accent); letter-spacing:.5px; }
  #panel .ph h2 { margin:6px 0 0; font-size:18px; }
  #panel .ph .meta { margin-top:6px; font-size:12px; color:var(--dim); }
  #panel .body { padding:8px 20px 28px; overflow:auto; }
  .quote { background:var(--leaf); border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin:12px 0; }
  .quote .pg { font-size:11px; color:var(--accent); margin-bottom:7px; }
  .quote .pg .ch { color:var(--dim); margin-left:6px; }
  .quote .tx { font-size:13.5px; line-height:1.65; }
  .quote .my { margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); font-size:12.5px; color:#cdb9e6; }
  .quote .my::before { content:"💭 "; }
  .summary { background:#26302b; border:1px solid var(--theme-b); border-radius:10px; padding:13px 15px; margin:12px 0 4px; font-size:14px; line-height:1.6; color:#d9f3e3; }
  .summary::before { content:"📝 한 문장 정리"; display:block; font-size:11px; color:var(--accent); margin-bottom:6px; letter-spacing:.3px; }
  .srclabel { font-size:11px; color:var(--dim); margin:16px 0 -4px; letter-spacing:.3px; }
  .empty { color:var(--dim); font-size:13px; padding:18px 0; }
  #panel .close { position:absolute; top:14px; right:16px; cursor:pointer; color:var(--dim); font-size:20px; line-height:1; background:none; border:none; }
  .hint { position:absolute; bottom:16px; left:22px; font-size:12px; color:var(--dim); }
  .err { padding:40px; color:#e88; font-size:14px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <header>
      <h1 id="h-title">개념 위계</h1>

    </header>
    <svg id="svg"></svg>
    <div class="hint">초록=상위 테마 · 회색=개념 · 보라=책</div>

  <aside id="panel">
    <div class="ph">

      <div class="kind" id="p-kind"></div>
      <h2 id="p-title"></h2>
      <div class="meta" id="p-meta"></div>
    </div>
    <div class="body" id="p-body"></div>
  </aside>
</div>

<script>
if (!window.DATA) {
  document.getElementById('stage').innerHTML = '<div class="err">hier-data.js 가 없습니다. 먼저 <code>node eval/protoReal.mjs</code> 를 실행하세요.</div>';
} else { (function(){
  const MEMOS = window.DATA.memos, TREE = window.DATA.tree;
  document.getElementById('h-title').textContent = `${window.DATA.book.title} — 개념 위계`;

  // ─── 레이아웃 (tidy tree) ──────────────────────────────────
  const COLX=[70,300,580], ROWH=44, NODE_H=30, TOP=92;
  let leafY=0;
  function measure(n, depth){
    n.depth=depth; n.kind=n.kind||'leaf';
    if(n.children&&n.children.length){ n.children.forEach(c=>measure(c,depth+1)); n.y=(n.children[0].y+n.children[n.children.length-1].y)/2; }
    else { n.y=TOP+leafY*ROWH; leafY++; }
    n.x=COLX[Math.min(depth,2)];
    n.allPages = n.children&&n.children.length ? [...new Set(n.children.flatMap(c=>c.allPages))] : [...new Set(n.pages||[])];
    return n;
  }
  measure(TREE,0);
  const allNodes=[]; (function walk(n){allNodes.push(n);(n.children||[]).forEach(walk);})(TREE);
  const W=COLX[2]+280, H=TOP+leafY*ROWH+24;
  document.getElementById('h-sub').textContent = `${window.DATA.book.author||''} · 발췌 ${new Set(allNodes.flatMap(n=>n.allPages)).size}개 → 개념 ${allNodes.filter(n=>n.kind==='leaf').length} / 테마 ${allNodes.filter(n=>n.kind==='theme').length} · 노드를 누르면 실제 발췌가 보여요`;

  const NS='http://www.w3.org/2000/svg';
  const svg=document.getElementById('svg');
  svg.setAttribute('width',W); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const nodeW=n=> 24 + [...n.title].length*13.5 + (n.allPages.length?34:0);
  allNodes.forEach(n=>(n.children||[]).forEach(c=>{
    const x1=n.x+nodeW(n), y1=n.y, x2=c.x, y2=c.y, mx=(x1+x2)/2;
    svg.appendChild(el('path',{class:'link',d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`}));
  }));
  allNodes.forEach(n=>{
    const w=nodeW(n), g=el('g',{class:`node ${n.kind}`,transform:`translate(${n.x},${n.y-NODE_H/2})`});
    g.appendChild(el('rect',{width:w,height:NODE_H,x:0,y:0}));
    const tx=el('text',{x:14,y:NODE_H/2}); tx.textContent=n.title; g.appendChild(tx);
    if(n.allPages.length){ const c=el('text',{class:'cnt',x:w-24,y:NODE_H/2}); c.textContent='📄'+n.allPages.length; g.appendChild(c); }
    g.addEventListener('click',()=>select(n,g)); n._g=g; svg.appendChild(g);
  });

  let selG=null;
  function countLeaves(n){ return n.children&&n.children.length?n.children.reduce((s,c)=>s+countLeaves(c),0):1; }
  window.closePanel=function(){ document.getElementById('panel').classList.remove('open'); if(selG){selG.classList.remove('sel');selG=null;} };
  const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function select(n,g){
    if(selG)selG.classList.remove('sel'); g.classList.add('sel'); selG=g;
    document.getElementById('p-kind').textContent = n.kind==='root'?'책':n.kind==='theme'?'상위 테마':'개념';
    document.getElementById('p-title').textContent=n.title;
    const pages=[...new Set(n.allPages)].sort((a,b)=>a-b);
    document.getElementById('p-meta').textContent=(n.kind!=='leaf'?`하위 ${countLeaves(n)}개 개념 · `:'')+`발췌 ${pages.length}개`;
    const body=document.getElementById('p-body'); body.innerHTML='';
    if(n.summary){ const s=document.createElement('div'); s.className='summary'; s.textContent=n.summary; body.appendChild(s); }
    if(pages.length){ const lb=document.createElement('div'); lb.className='srclabel'; lb.textContent='수집한 발췌'; body.appendChild(lb); }
    if(!pages.length && !n.summary){ body.innerHTML='<div class="empty">직접 수집된 발췌가 없는 노드예요.</div>'; }
    else pages.forEach(p=>{
      const m=MEMOS[p]; if(!m)return;
      const q=document.createElement('div'); q.className='quote';
      q.innerHTML=`<div class="pg">p.${p}${m.chapter?`<span class="ch">${esc(m.chapter)}</span>`:''}</div><div class="tx">${esc(m.t)}</div>`+(m.m?`<div class="my">${esc(m.m)}</div>`:'');
      body.appendChild(q);
    });
    document.getElementById('panel').classList.add('open');
  }
})(); }
</script>
